              - { name: cardSummary, label: 内部要約（現行非表示）, type: text, readonly: true }
              - { name: cardStatus, label: 内部ステータス（現行非表示）, type: string, readonly: true }
              - { name: featured, label: 掲載, type: boolean, readonly: true }
              - { name: href, label: リンク先, type: string, readonly: true }
