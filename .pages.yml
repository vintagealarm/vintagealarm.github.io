  - name: ownerDirectory
    label: OWNER'S NOTES / HISTORY サムネ・一覧
    type: file
    path: src/data/owners-directory.json
    format: json
    fields:
      - name: entries
        label: 所有個体
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{historyId}"
        fields:
          - { name: historyId, label: ID, type: string, required: true, readonly: true }
          - { name: ownedGroup, label: OWNER'S NOTES大見出し年代, type: string, required: true }
          - { name: ownedEra, label: OWNER'S NOTES補足年代, type: string, required: true }
          - { name: ownedSortKey, label: OWNER'S NOTES並びキー, type: number, required: true }
          - { name: historyEra, label: HISTORY章, type: string, required: true }
          - { name: ownersThumbnail, label: OWNER'S NOTES一覧サムネ, type: image, required: true }
          - { name: historyThumbnail, label: HISTORY一覧サムネ, type: image, required: true }
          - { name: fallbackThumbnail, label: 一覧サムネfallback, type: image, required: true }
          - { name: directoryCatch, label: 一覧キャッチ, type: text }
          - { name: image, label: 旧共通サムネ（互換用・触らない）, type: image, readonly: true }

  - name: research
    label: RESEARCH 公開設定
    type: file
    path: src/data/research-settings.json
    format: json
    fields:
      - name: published
        label: RESEARCHを公開
        type: boolean
        default: false
      - name: title
        label: 見出し
        type: string
        readonly: true
      - name: lead
        label: 導入文
        type: text
        readonly: true

  - name: cymaChronometreResearch
    label: CYMA Chronomètre Research
    type: file
    path: src/data/cyma-chronometre-research.json
    format: json
    fields:
      - { name: published, label: 公開, type: boolean, default: true }
      - { name: title, label: 英字タイトル, type: string }
      - { name: heading, label: ページ見出し, type: string }
      - name: lead
        label: 導入文
        type: text
        list: true
      - { name: heroImage, label: ヒーロー画像, type: image }
      - name: documented
        label: 01 / Chronomètre仕様
        type: object
        fields:
          - { name: title, label: 見出し, type: string }
          - { name: intro, label: 導入, type: text }
          - name: cards
            label: 文献・資料
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{label} / {title}"
            fields:
              - { name: label, label: 左ラベル, type: string }
              - { name: meta, label: 補足ラベル, type: string }
              - { name: title, label: タイトル, type: string }
              - { name: body, label: 本文, type: text }
              - { name: image, label: 画像, type: image }
      - name: observed
        label: 02 / 観測個体一覧
        type: object
        fields:
          - { name: title, label: 見出し, type: string }
          - { name: intro, label: 導入, type: text }
          - { name: refNote, label: Ref.1283 / 1261注記, type: text }
          - { name: note, label: 公開時注記, type: text }
          - name: images
            label: 02 / 補足画像
            type: object
            list:
              max: 8
              collapsible:
                collapsed: true
                summary: "{caption}"
            fields:
              - { name: image, label: 画像, type: image }
              - { name: caption, label: キャプション, type: text }
              - { name: alt, label: alt, type: string }
          - name: specimens
            label: 観測記録
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{id} / {source}"
            fields:
              - { name: id, label: 公開ID, type: string }
              - { name: sellerRef, label: seller ref, type: string }
              - { name: era, label: 年代, type: string }
              - { name: case, label: ケース, type: string }
              - { name: dial, label: ダイヤル, type: string }
              - { name: chronometre, label: Chronomètre表記, type: string }
              - { name: adjustment, label: 調整刻印, type: string }
              - { name: movementBand, label: Movement No.帯, type: string }
              - { name: caseCode, label: ケースコード, type: string }
              - { name: source, label: 情報源, type: string }
              - { name: sourceUrl, label: 情報源URL, type: string }
      - name: mismatch
        label: 内部 / 代表パターン（Aでは直接表示しない）
        type: object
        fields:
          - { name: title, label: 見出し, type: string }
          - { name: intro, label: 導入, type: text }
          - name: cards
            label: 代表パターン
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{label} / {title}"
            fields:
              - { name: label, label: ラベル, type: string }
              - { name: title, label: タイトル, type: string }
              - { name: body, label: 本文, type: text }
      - name: archive
        label: 04 / 外部照会
        type: object
        fields:
          - { name: title, label: 見出し, type: string }
          - { name: intro, label: 導入, type: text }
          - name: cards
            label: 機関回答
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{label} / {title}"
            fields:
              - { name: label, label: ラベル, type: string }
              - { name: title, label: タイトル, type: string }
              - { name: body, label: 本文, type: text }
          - { name: clueLabel, label: 手掛かりラベル, type: string }
          - { name: clueQuote, label: 手掛かり引用, type: string }
          - { name: clueBody, label: 手掛かり本文, type: text }
          - { name: note, label: 断定範囲の注記, type: text }
      - name: tariff
        label: 03 / UNADJUSTED刻印
        type: object
        fields:
          - { name: title, label: 見出し, type: string }
          - { name: intro, label: 導入, type: text }
          - name: body
            label: 本文
            type: text
            list: true
          - { name: image, label: 米国上院資料画像, type: image }
          - { name: caption, label: 画像キャプション, type: text }
      - name: failure
        label: 05 / アラーム起動での不具合
        type: object
        fields:
          - { name: title, label: 見出し, type: string }
          - { name: intro, label: 導入, type: text }
          - { name: normalTitle, label: 正常仕様タイトル, type: string }
          - { name: normalBody, label: 正常仕様本文, type: text }
          - { name: observedTitle, label: 観測症状タイトル, type: string }
          - { name: observedBody, label: 観測症状本文, type: text }
          - name: examples
            label: 同症状を確認した例
            type: string
            list: true
          - name: images
            label: 支点部・組付け写真
            type: object
            list:
              max: 4
              collapsible:
                collapsed: true
                summary: "{caption}"
            fields:
              - { name: image, label: 画像, type: image }
              - { name: caption, label: キャプション, type: text }
              - { name: alt, label: alt, type: string }
          - { name: youtubeId, label: 押し込み状態鳴動 YouTube URL / ID, type: string }
          - { name: youtubeCaption, label: YouTubeキャプション, type: text }
      - name: conclusion
        label: 結び / ここまでで言えること
        type: object
        fields:
          - { name: title, label: 見出し, type: string }
          - name: items
            label: 裁定
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{label}"
            fields:
              - { name: label, label: ラベル, type: string }
              - { name: text, label: 本文, type: text }
      - name: sources
        label: 参考資料・確認範囲
        type: string
        list: true

  - name: howTheyRingRelease
    label: HOW THEY RING 公開設定
    type: file
    path: src/data/how-they-ring-settings.json
    format: json
    operations:
      delete: false
    fields:
      - name: productionPublished
        label: 本番公開する
        description: mainブランチでONにして保存すると /how-they-ring/ を本番公開します。OFFでは本番ページ内容を公開しません。preview branchでの変更は本番公開にはなりません。
        type: boolean
        default: false
      - name: showOnTop
        label: TOPに「音で選ぶ」を表示
        description: 本番公開がONのときだけ、TOPのOWNER'S NOTESの次に「音で選ぶ」を表示します。
        type: boolean
        default: false

  - name: howTheyRing
    label: HOW THEY RING
    type: collection
    path: src/content/how-they-ring
    format: yaml-frontmatter
    operations:
      create: false
      rename: false
      delete: false
    view:
      fields: [title, category, published, audio.status]
      primary: title
      search: [title, watchSlug]
    fields:
      - { name: title, label: 時計, type: string, required: true, readonly: true }
      - { name: watchSlug, label: 対応するWATCH, type: string, required: true, readonly: true }
      - name: published
        label: ギャラリー内に掲載
        description: OFFにすると、この個体だけHOW THEY RINGから非表示になります。ページ全体の本番公開は「HOW THEY RING 公開設定」で切り替えます。
        type: boolean
        default: false
      - name: category
        label: 鳴動方式
        type: select
        required: true
        options:
          values:
            - { name: gong, label: "01 GONG / ゴング" }
            - { name: caseback, label: "02 CASEBACK / ケースバック" }
            - { name: bell, label: "03 BELL / ベル" }
      - name: thumbnail
        label: サムネイル
        description: 空欄ならOWNER'S NOTES一覧と同じ時計写真を表示します。
        type: image
        options:
          media: images
      - name: audio
        label: 音源
        type: object
        fields:
          - name: status
            label: 再生の公開状態
            description: 再生可能にすると、ファイルを登録した音源だけ再生できます。
            type: select
            default: pending
            options:
              values:
                - { name: pending, label: 準備中 }
                - { name: ready, label: 再生可能 }
          - name: recordings
            label: 録音
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{label}"
            fields:
              - name: id
                label: 音源ID
                type: uuid
                options:
                  editable: false
              - { name: label, label: 音源名, type: string, required: true }
              - name: src
                label: 音声ファイル
                type: file
                required: true
                options:
                  media: alarmAudio
                  categories: [audio]
                  extensions: [mp3, m4a, wav]
              - { name: recordedWith, label: 録音機材, type: string }
              - { name: distanceCm, label: 録音距離（cm）, type: number }
              - { name: position, label: 録音位置, type: string }
              - { name: processed, label: 加工済み, type: boolean }
