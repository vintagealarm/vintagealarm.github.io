media:
  - name: images
    input: public/images
    output: /images
    rename: false
    categories: [image]
  - name: alarmAudio
    label: アラーム音源
    input: public/audio/alarms
    output: /audio/alarms
    rename: safe
    categories: [audio]
    extensions: [mp3, m4a, wav]

content:
  - name: watches
    label: Watches
    type: collection
    path: src/content/watches
    fields:
      - name: slug
        label: Slug
        type: string
        required: true
        readonly: true
      - name: published
        label: 公開（OFFで下書き）
        type: boolean
        default: false
      - name: ownerNumber
        label: OWNER'S NOTE No.
        type: string
        required: true
      - name: brand
        label: Brand
        type: string
        required: true
      - name: model
        label: Model
        type: string
        required: true
      - name: catch
        label: Catch
        type: string
        list:
          min: 1
          max: 2
      - name: ownersNote
        label: OWNER'S NOTE
        type: object
        fields:
          - name: image
            label: Artwork
            type: image
            required: true
          - name: lead
            label: Lead
            type: text
            list: true
          - name: guideTitle
            label: Guide title
            type: string
          - name: guide
            label: Guide
            type: text
            list: true
          - name: noteTitle
            label: Note title
            type: string
          - name: note
            label: Note
            type: text
            list: true
      - name: spec
        label: SPEC
        type: object
        fields:
          - { name: era, label: 年代, type: string }
          - { name: caseSize, label: ケースサイズ, type: string }
          - { name: caliber, label: Cal, type: string }
          - { name: jewels, label: 石, type: string }
          - { name: frequency, label: 振動, type: string }
          - { name: barrels, label: 香箱, type: string }
          - { name: winding, label: 手巻き, type: string }
          - { name: acoustic, label: 音響, type: string }
          - { name: notes, label: 特記事項, type: text }
      - name: specimenGallery
        label: 掲載個体ギャラリー
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
        fields:
          - { name: image, label: 画像, type: image, required: true }
          - { name: label, label: 表示名（例：正面 / 側面 / 裏面）, type: string }
          - { name: alt, label: altテキスト, type: string }
      - name: video
        label: 実機鳴動
        type: object
        fields:
          - { name: youtubeId, label: YouTube URL / ID, type: string }
          - { name: xUrl, label: OWNER'S NOTE post on X, type: string }
      - name: deepDive
        label: DEEP DIVE
        type: object
        list:
          min: 1
          max: 8
          collapsible:
            collapsed: true
            summary: "{number}｜{title}"
        fields:
          - { name: number, label: No., type: string }
          - { name: title, label: Title, type: string }
          - { name: subtitle, label: Subtitle, type: string }
          - name: paragraphs
            label: Paragraphs
            type: text
            list: true
          - name: citationRefs
            label: 出典番号（段落順）
            type: string
            list: true
          - { name: linkLabel, label: 補足リンク文言, type: string }
          - { name: linkUrl, label: 補足リンクURL, type: string }
          - { name: mediaStyle, label: 画像レイアウト（default / compact-sequence）, type: string }
          - name: images
            label: 補足画像
            type: object
            list:
              max: 8
              collapsible:
                collapsed: true
                summary: "{caption}"
            fields:
              - { name: src, label: 画像, type: image, required: true }
              - { name: caption, label: キャプション, type: text }
              - { name: alt, label: altテキスト, type: string }
              - { name: afterParagraph, label: 何段落目の後に表示, type: number }
              - { name: fullRow, label: 横幅いっぱいで表示, type: boolean, default: false }
      - name: sourceMeta
        label: 出典種別
        type: object
        list:
          max: 30
          collapsible:
            collapsed: true
            summary: "{id} / {type}"
        fields:
          - { name: id, label: 出典番号, type: string }
          - { name: type, label: 種別 primary / reference / provenance / owner, type: string }
      - name: sources
        label: 参考資料・出典
        type: string
        list: true

  - name: history
    label: HISTORY 本文・MILESTONES
    type: file
    path: src/data/history-content.json
    format: json
    fields:
      - name: coverMilestones
        label: 表紙4マイルストーン
        type: object
        list:
          min: 4
          max: 4
          collapsible:
            collapsed: true
            summary: "{year} / {line1} {line2}"
        fields:
          - { name: year, label: 年, type: string, required: true }
          - { name: line1, label: 1行目, type: string, required: true }
          - { name: line2, label: 2行目, type: string, required: true }
          - { name: href, label: ジャンプ先, type: string, required: true, readonly: true }

      - name: hero
        label: 表紙下部コピー
        type: object
        required: true
        fields:
          - name: kicker
            label: 2行コピー
            type: string
            list:
              min: 2
              max: 2

      - name: before
        label: 00 / BEFORE THE WRIST
        type: object
        required: true
        fields:
          - { name: chapterNo, label: Chapter No., type: string, readonly: true }
          - { name: label, label: 章ラベル, type: string, readonly: true }
          - { name: title, label: 章タイトル, type: string }
          - { name: teaser, label: 目次・要約, type: text }
          - name: intro
            label: 導入本文
            type: text
            list: true

      - name: era1910s
        label: 01 / 1910s
        type: object
        required: true
        fields:
