name: Deploy AI Readable Relay

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "cloudflare/ai-relay/**"
      - ".github/workflows/deploy-ai-relay-pages.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/ai-relay
    steps:
      - name: Checkout canonical repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check relay JavaScript
        run: |
          node --check functions/index.js
          node check-relay.mjs
          npx --yes wrangler@4 pages functions build --outfile /tmp/va-relay.mjs
          node check-built-routes.mjs /tmp/va-relay.mjs

      - name: Check deployment credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::AI relay deployment requires CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
            exit 1
          fi

      - name: Deploy Pages relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy \
            --branch main \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "VINTAGE ALARM AI readable analytics relay"

      - name: Verify live routing and upstream transport
        run: node check-live-relay.mjs
