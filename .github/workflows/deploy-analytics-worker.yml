name: Deploy Analytics Worker

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "cloudflare/analytics-dashboard/**"
      - ".github/workflows/deploy-analytics-worker.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/analytics-dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Check worker JavaScript
        run: |
          node --check worker.js
          node --check profile-worker.js
          node --check entry-worker.js

      - name: Check generated dashboard JavaScript
        run: node check-generated-html.mjs

      - name: Check X profile attribution wrapper
        run: node check-profile-wrapper.mjs

      - name: Check deployment credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Analytics Worker deployment requires CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
            exit 1
          fi

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

      - name: Verify live Worker security boundary
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          status="$(curl --silent --show-error --retry 3 --max-time 30 \
            -D "$headers" \
            -o /tmp/analytics-unauth.txt \
            -w '%{http_code}' \
            'https://vintage-alarm-analytics.orima1995.workers.dev/api/analytics?window=1h')"
          test "$status" = "401" || { echo "Expected unauthenticated analytics endpoint to return 401, got $status"; exit 1; }
          grep -Eiq '^www-authenticate: Basic ' "$headers"
          grep -Eiq '^cache-control: no-store' "$headers"
          grep -Eiq '^x-robots-tag: noindex, nofollow, noarchive' "$headers"
