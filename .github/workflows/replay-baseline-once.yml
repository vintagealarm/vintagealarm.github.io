name: Replay Fresh Baseline Once

on:
  push:
    branches:
      - "eval/replay-baseline-20261006"
    paths:
      - "scripts/replay-fresh-baseline.once.mjs"
      - ".github/workflows/replay-baseline-once.yml"

permissions:
  contents: read
  pull-requests: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify baseline secret
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Repository OPENAI_API_KEY is unavailable; fresh baseline cannot run through direct Responses API."
            exit 1
          fi

      - name: Run 9 fresh-context Replay Eval cases
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPLAY_MODEL: gpt-5.6-terra
        run: node scripts/replay-fresh-baseline.once.mjs
