name: One-time Citizen original image import
on:
  push:
    branches: [fix/citizen-note-images-20261010]
permissions:
  contents: write
jobs:
  import:
    if: "${{ github.event.head_commit.message == 'chore: import Citizen original images' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/citizen-note-images-20261010
      - name: Validate 3 original images against uploaded SHA256 and import
        run: |
          cat > /tmp/citizen-import.py <<'PY'
          import urllib.request,struct,hashlib,pathlib
          sources={
            'ja': ("https://lh7-us.googleusercontent.com/docsdf/AFQj2d45ZkvyOoeoKDfklyFkKeKvwNVnozr957-XW6ulK0e89gHfQc8msFqiPm7kReBpnySXXiMKHhUNHEkPBOCzwCQGKTcZFWYpm2loLA3Qx_kqBfUiqkeAhXAGcRP1b0Nw9TUNHgDTuYhNUy5amP6d1BdH4zgl_1o2UzO3qbs6bkKN7fUb=s1600", 'bf3dcacb73c1daeec3bbe03dc54e11d839463d7d72bb1a1576f9f476b325a444', 993728),
            'en': ("https://lh7-us.googleusercontent.com/docsdf/AFQj2d4FHH5ukOCSCJbZ3eelRVIh1AtV4ypDiUOUnQG0WzfsxC6vbDPl1XWVjMKQGObeSIqymVC-x-B0rWZequohP76PQA2EyC2bD5NlDh_r244rjM5xYxc4dFZ3UaBJn7qlROdq_F8Ek_a3E6OCTuhQvcL272LV8g5RBQB6ZhR0ItKYRr2z=s1600", '95f28ea000801f97aa36a36a15d2ac8850aaa2afe99e49603d1abf7aa3eee22a', 990879),
            'de': ("https://lh7-us.googleusercontent.com/docsdf/AFQj2d6XFoc6B2r_G9lTncG2ERZc1OawAMy2sK1vey7eu1y5dZ0TMknp-pjdBo2MNk9zlK1pkVpNMZLx4rtxpL24BdA2LqBf1JKJ-Sr5b3QCKu_Lt8fge6uCj0ozQ2p7pyK5HmSApu9muAD2gYnCQwdrvtVJEJSXpQZnEglr-nQ8A8K5H3g=s1600", 'a6bd0511ff37df71109881c52c5c3333f2654a1d038d7707d0987a95f87c2853', 1021593)
          }
          data={}
          for lang,(url,expected_sha,expected_bytes) in sources.items():
              with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"}),timeout=70) as response:
                  b=response.read()
              sha=hashlib.sha256(b).hexdigest()
              dims=struct.unpack(">II",b[16:24]) if b[:8]==bytes([137,80,78,71,13,10,26,10]) else None
              print(lang,len(b),dims,sha)
              if (len(b),dims,sha)!=(expected_bytes,(1146,1600),expected_sha):
                  raise RuntimeError("Source mismatch, abort entire import")
              data[lang]=b
          for lang,b in data.items():
              p=pathlib.Path(f"public/images/citizen-alarm/owners-note-{lang}-20261010.png")
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(b)
          PY
          python /tmp/citizen-import.py
      - name: Commit images only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/citizen-alarm/owners-note-*.png
          git diff --staged --quiet && exit 1
          git commit -m "assets: publish verified Citizen original PNGs"
          git push origin HEAD:fix/citizen-note-images-20261010
