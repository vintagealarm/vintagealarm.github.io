name: Astro foundation check

on:
  push:
    branches: ["refactor/astro-foundation"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify internal links and SEO
        run: npm run check:quality
      - name: Verify quality gates reject regressions
        run: npm run test:quality
      - name: Verify OWNER'S NOTES directory
        run: node scripts/check-owner-directory.mjs
      - name: Verify publication-aware site output
        run: node scripts/check-build-output.mjs
      - name: Install browser for layout check
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify rendered mobile layouts
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/vintage-alarm-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:4321/ >/dev/null; then
              break
            fi
            sleep 1
          done
          node scripts/check-layout.mjs
