name: One-time Westclox original image import
on:
  push:
    branches: [fix/westclox-owner-note-trilingual-20261011]
permissions:
  contents: write
jobs:
  import:
    if: "${{ github.event.head_commit.message == 'chore: import Westclox original images' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/westclox-owner-note-trilingual-20261011
      - name: Install Pillow for pixel-equivalence diagnostics
        run: python -m pip install --quiet Pillow
      - name: Validate attached originals and import exact PNG bytes
        run: |
          cat > /tmp/westclox-import.py <<'PY'
          import urllib.request, struct, hashlib, pathlib, io, base64, zlib
          from PIL import Image
          sources={
            'ja': ("https://lh7-us.googleusercontent.com/docsdf/AFQj2d42SbHZnGPEP-I1DJTZu70L5VWlYMqpJLiHH0sTzYt-OA_0DHi3RlzQFDls2ivtDgNK0BidvTkKJR6JGYcbyQDLa4zxVkC1PI4-j5j4XJdZjW-Z05nqqfg25Nvaz8Do2sx87NsFsYu-sD0ubzNFlr4b7nFzfzSUTpcjnShr46v7-MSR=s1600", '813ec4e5b94e86c2924ad8c0fe07f20d4d843d0157284320d07e119a7880870c', 950123),
            'en': ("https://lh7-us.googleusercontent.com/docsdf/AFQj2d4SZ0zkYz1EJ3LPxHDM5uRsPoynkwhhFzhEGrT63e-Fxm_JFgTde9BQA_rLYIyKwE9l-IK0YtTbElByN6c_4eIxf8O68ifATr2N3S2phwZF8wS0S1riEGbWVHK-GIp4l5hH5Kwb1-0pTjNgNd8xXy9I0svDH7QGnDq_sifQExRpA9zz=s1600", '736afa7fc265c30d988288a79a7149e7ec9136ec5526fce6ad8284b8ec097d26', 1004457),
            'de': ("https://lh7-us.googleusercontent.com/docsdf/AFQj2d543TO6SUiGq97mkIdXzEca4QAgsvkz84HeVMHwIo9ekVCr5S9MefQtF8vOVDu4fNNBHh0v7MLSFmxAtBdYoPh_0rQ1QsFAfXbmRJqSQMLdAJ8hvgi3UWAL-qSrG-wZBAi4FVXbpf-PIOPVaskjH7LV1pPg-o9B_j7BA_PG3BQIpGR1=s1600", 'aa97707cae12bff781ba95b1ace5fef93f2271b8067781cf6ced77fc2e83eafe', 1462979)
          }
          data={}
          failures=[]
          expected_pixels={'ja':'4eded9062cc44809882950f4a2b491d8b453cabb2d55a60e4567f12e93e4c3d8','en':'9d8752a9b8db43b67b46865ae0cd102621456cf5c16380d879aa2c843abd377e','de':'0db142d8f1cedae72e0504b5c4f940173fede397628fe055a416031d04b1f416'}
          for lang,(url,expected_sha,expected_bytes) in sources.items():
              with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"}),timeout=70) as response:
                  b=response.read()
              sha=hashlib.sha256(b).hexdigest()
              dims=struct.unpack(">II",b[16:24]) if b[:8]==bytes([137,80,78,71,13,10,26,10]) else None
              pixels=hashlib.sha256(Image.open(io.BytesIO(b)).convert("RGBA").tobytes()).hexdigest()
              print(lang,"bytes",len(b),"dimensions",dims,"sha",sha,"pixel_sha",pixels,"pixel_match",pixels==expected_pixels[lang])
              if lang=="ja":
                  reference=base64.b64decode("")
                  image=Image.open(io.BytesIO(b)).convert("RGBA")
                  n=0; mismatches=[]
                  for yy in range(0,image.height,128):
                      for xx in range(0,image.width,128):
                          expected=struct.unpack(">I",reference[n*4:n*4+4])[0]
                          actual=zlib.crc32(image.crop((xx,yy,min(xx+128,image.width),min(yy+128,image.height))).tobytes())
                          if expected!=actual:mismatches.append((xx,yy))
                          n+=1
                  print("ja_tile_mismatch_count",len(mismatches),"tiles",mismatches)
              if (len(b),dims,sha)!=(expected_bytes,(1146,1600),expected_sha):
                  failures.append(lang)
              data[lang]=b
          if failures:
              raise RuntimeError("Byte-exact source mismatch: "+",".join(failures)+"; no images imported")
          for lang,b in data.items():
              p=pathlib.Path(f"public/images/westclox-watchlarm/owners-note-{lang}-20261011.png")
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(b)
          PY
          python /tmp/westclox-import.py
      - name: Commit three validated originals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/westclox-watchlarm/owners-note-*.png
          git diff --staged --quiet && exit 1
          git commit -m "assets: publish verified Westclox original PNGs"
          git push origin HEAD:fix/westclox-owner-note-trilingual-20261011
