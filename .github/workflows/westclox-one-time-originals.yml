name: One-time Westclox original image import
on:
  push:
    branches: [fix/westclox-owner-note-trilingual-20261011]
permissions:
  contents: write
jobs:
  import:
    if: "${{ github.event.head_commit.message == 'chore: import Westclox original images' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/westclox-owner-note-trilingual-20261011
      - name: Install PNG decoder
        run: python -m pip install --quiet Pillow
      - name: Verify attached image bytes and visible pixels before import
        run: |
          cat > /tmp/westclox-import.py <<'PY'
          import urllib.request, struct, hashlib, pathlib, io, time
          from PIL import Image
          sources={
            'ja': ("https://lh7-us.googleusercontent.com/docsdf/AFQj2d42SbHZnGPEP-I1DJTZu70L5VWlYMqpJLiHH0sTzYt-OA_0DHi3RlzQFDls2ivtDgNK0BidvTkKJR6JGYcbyQDLa4zxVkC1PI4-j5j4XJdZjW-Z05nqqfg25Nvaz8Do2sx87NsFsYu-sD0ubzNFlr4b7nFzfzSUTpcjnShr46v7-MSR=s1600", "813ec4e5b94e86c2924ad8c0fe07f20d4d843d0157284320d07e119a7880870c", 950123, "4eded9062cc44809882950f4a2b491d8b453cabb2d55a60e4567f12e93e4c3d8"),
            'en': ("https://lh7-us.googleusercontent.com/docsdf/AFQj2d4r_ldUbQF9xf5UN942FejIKQn1OK0nIh34EBQC9bFwBAcnXDh6X5T6DHUf8mDFolRWA5OZ9Jd4rQbAKU9zi3wGXbU8P_A34DNQt9SA4VT217M0gfw9jHn0t1kJPxx7mElPzOgieCSHptr9Be3v6NAltr6ClY3LNIkODXOgMslx20zV=s1600", "736afa7fc265c30d988288a79a7149e7ec9136ec5526fce6ad8284b8ec097d26", 1004457, "9d8752a9b8db43b67b46865ae0cd102621456cf5c16380d879aa2c843abd377e"),
            'de': ("https://lh7-us.googleusercontent.com/docsdf/AFQj2d543TO6SUiGq97mkIdXzEca4QAgsvkz84HeVMHwIo9ekVCr5S9MefQtF8vOVDu4fNNBHh0v7MLSFmxAtBdYoPh_0rQ1QsFAfXbmRJqSQMLdAJ8hvgi3UWAL-qSrG-wZBAi4FVXbpf-PIOPVaskjH7LV1pPg-o9B_j7BA_PG3BQIpGR1=s1600", "aa97707cae12bff781ba95b1ace5fef93f2271b8067781cf6ced77fc2e83eafe", 1462979, "0db142d8f1cedae72e0504b5c4f940173fede397628fe055a416031d04b1f416")
          }
          saved={}
          for lang,(url,expected_sha,expected_size,expected_pixel_sha) in sources.items():
              ok=False
              for attempt in range(1,17):
                  with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Cache-Control":"no-cache"}),timeout=75) as response:
                      b=response.read()
                  sha=hashlib.sha256(b).hexdigest()
                  dims=struct.unpack(">II",b[16:24]) if b[:8]==bytes([137,80,78,71,13,10,26,10]) else None
                  pixelsha=hashlib.sha256(Image.open(io.BytesIO(b)).convert("RGBA").tobytes()).hexdigest() if dims==(1146,1600) else "invalid"
                  exact=(len(b)==expected_size and sha==expected_sha)
                  pixel_match=(pixelsha==expected_pixel_sha)
                  ok=dims==(1146,1600) and (exact if lang!="de" else pixel_match)
                  print(lang,attempt,"bytes",len(b),"sha256",sha,"pixel_match",pixel_match,"byte_exact",exact,flush=True)
                  if ok:
                      saved[lang]=b
                      break
                  if attempt<16:time.sleep(3)
              if not ok:
                  raise RuntimeError(f"{lang}: source not equivalent to uploaded image; abort")
          for lang,b in saved.items():
              p=pathlib.Path(f"public/images/westclox-watchlarm/owners-note-{lang}-20261011.png")
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(b)
          PY
          python /tmp/westclox-import.py
      - name: Commit all three images together
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/westclox-watchlarm/owners-note-*.png
          git diff --staged --quiet && exit 1
          git commit -m "assets: publish verified Westclox trilingual PNGs"
          git push origin HEAD:fix/westclox-owner-note-trilingual-20261011
