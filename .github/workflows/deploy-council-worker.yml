name: Deploy Council Worker

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "council-worker/**"
      - ".github/workflows/deploy-council-worker.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: council-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Check deployment credentials
        id: deploy_config
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COUNCIL_VECTOR_STORE_ID: ${{ secrets.COUNCIL_VECTOR_STORE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            if [ -n "$OPENAI_API_KEY" ] && [ -n "$COUNCIL_VECTOR_STORE_ID" ]; then
              echo "sync_worker_secrets=true" >> "$GITHUB_OUTPUT"
            else
              echo "sync_worker_secrets=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Deploying without rewriting Worker application secrets; existing OPENAI_API_KEY and COUNCIL_VECTOR_STORE_ID remain in place."
            fi
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "sync_worker_secrets=false" >> "$GITHUB_OUTPUT"
            echo "::error::Council Worker deploy blocked: configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
            exit 1
          fi

      - name: Set Worker secrets
        if: steps.deploy_config.outputs.sync_worker_secrets == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COUNCIL_VECTOR_STORE_ID: ${{ secrets.COUNCIL_VECTOR_STORE_ID }}
        run: |
          set -euo pipefail
          printf '%s' "$OPENAI_API_KEY" | npx wrangler secret put OPENAI_API_KEY
          printf '%s' "$COUNCIL_VECTOR_STORE_ID" | npx wrangler secret put COUNCIL_VECTOR_STORE_ID

      - name: Deploy Worker
        if: steps.deploy_config.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

      - name: Verify Fourth Jester live health and menu
        if: steps.deploy_config.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          url="https://council-api.orima1995.workers.dev"
          health="$(curl -fsS --retry 6 --retry-delay 3 --retry-connrefused --max-time 15 "$url/health")"
          printf '%s' "$health" | node -e '
            let body=""; process.stdin.on("data", c=>body+=c);
            process.stdin.on("end",()=>{
              const o=JSON.parse(body);
              console.log("Worker health:",JSON.stringify({
                version:o.version,openai:o.openai,vectorStore:o.vectorStore,
                fourthJester:o.fourthJester
              }));
              if(o.ok!==true||o.version!=="council-v4"||o.fourthJester!==true)
                process.exitCode=1;
            });
          '
          menu="$(curl -fsS --retry 6 --retry-delay 3 --retry-connrefused --max-time 15 "$url/api/menu")"
          printf '%s' "$menu" | node -e '
            let body=""; process.stdin.on("data", c=>body+=c);
            process.stdin.on("end",()=>{
              const o=JSON.parse(body);
              console.log("Worker menu:",JSON.stringify({
                version:o.version,count:o.menu?.length,
                fourth:(o.menu||[])[6]?.slice(0,40)
              }));
              if(o.version!=="council-v4"||!Array.isArray(o.menu)||o.menu.length!==7)
                process.exitCode=1;
            });
          '
