name: Check analytics worker

on:
  push:
    paths:
      - "cloudflare/analytics-dashboard/**"
      - "cloudflare/ai-relay/**"
      - "cloudflare/check-free-plan.mjs"
      - ".github/workflows/check-analytics-worker.yml"
  pull_request:
    paths:
      - "cloudflare/analytics-dashboard/**"
      - "cloudflare/ai-relay/**"
      - "cloudflare/check-free-plan.mjs"
      - ".github/workflows/check-analytics-worker.yml"

jobs:
  cost-boundary:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify cost gate rejection cases
        run: node cloudflare/check-free-plan.mjs --self-test
      - name: Read account subscriptions without changing billing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_BILLING_READ_TOKEN: ${{ secrets.CLOUDFLARE_BILLING_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node cloudflare/check-free-plan.mjs
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check worker JavaScript
        run: |
          node --check cloudflare/analytics-dashboard/worker.js
          node --check cloudflare/analytics-dashboard/cyma-research-preview.js
          node --check cloudflare/analytics-dashboard/profile-worker.js
          node --check cloudflare/analytics-dashboard/entry-worker.js
          node --check cloudflare/ai-relay/functions/index.js
      - name: Check generated dashboard JavaScript
        run: node cloudflare/analytics-dashboard/check-generated-html.mjs
      - name: Check X profile and legacy AI URL wrapper
        run: node cloudflare/analytics-dashboard/check-profile-wrapper.mjs
      - name: Check production AI URL entry path
        run: node cloudflare/analytics-dashboard/check-entry-worker.mjs
      - name: Check AI relay behavior
        run: node cloudflare/ai-relay/check-relay.mjs
      - name: Check browser discovery sharing and short-link delivery gate
        run: node cloudflare/analytics-dashboard/check-discovery-share.mjs
      - name: Check compiled Pages routing
        working-directory: cloudflare/ai-relay
        run: |
          npx --yes wrangler@4 pages functions build --outfile /tmp/va-relay.mjs
          node check-built-routes.mjs /tmp/va-relay.mjs
