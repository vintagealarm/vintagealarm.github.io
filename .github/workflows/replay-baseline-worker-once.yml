name: Replay Fresh Baseline Worker Once

on:
  push:
    branches:
      - "eval/replay-baseline-20261006"
    paths:
      - "scripts/replay-fresh-baseline.once.mjs"
      - ".github/workflows/replay-baseline-worker-once.yml"

permissions:
  contents: read

jobs:
  baseline-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run 9 fresh-context Replay Eval cases through deployed worker
        env:
          REPLAY_WORKER_BASE: https://council-api.orima1995.workers.dev
        run: node scripts/replay-fresh-baseline.once.mjs
