name: One-time CYMA OWNER'S NOTE exact PNG transfer
on:
  push:
    branches: [fix/cyma-owner-note-ja-en-de-20261011]
permissions:
  contents: write
jobs:
  import:
    if: "${{ github.event.head_commit.message == 'chore: import CYMA image originals' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cyma-owner-note-ja-en-de-20261011
      - name: Install Pillow for pixel equivalence verification
        run: python -m pip install --quiet Pillow
      - name: Download and verify 3 supplied CYMA images
        run: |
          cat > /tmp/cyma-verify.py <<'PY'
          import urllib.request, struct, hashlib, pathlib, time, io, base64, zlib
          from PIL import Image
          originals={
            'ja': ("https://lh7-us.googleusercontent.com/docsdf/AFQj2d47i8FcbcqzyuB17U7ltl8GkwuX_gV3p_EBtpe00l4Yy1tqOXnWSWg37YLCabt4hCagBdYYjrOC3c0lyjstyuEpYFyLxTdi25S2vkLtW6a-Jw_E_LdZezinXGaV5odanl5eOjIuQnqA33_JcE-RUeGh-62OR8ShokehFc3XJ_dwpFj_=s1600", 976624, '82a834b9ed7446eb55e42b011304c35bc3e6aa67a2a1f13b302d6a5d429bc5ad'),
            'en': ("https://lh7-us.googleusercontent.com/docsdf/AFQj2d65iabiiW1kPtA6mgagu9x5g__V4fdGgnor6B7UxhE06hImPe0krg2UNkpel5px3ynzB_iZ01iWKb2E1pjNy08GYb2YHEGG5y8KYnprX0XUHqQCPTeyZZcgwEa8emEe9isT-0_4XDFq8RxprPUGjnjaSrF3Yo7UFLvT4FFUO-mnp39d=s1600", 1013172, 'f39a9cf449238262080a5583f300105b6acbcec775a34bf8363189b1318ca513'),
            'de': ("https://lh7-us.googleusercontent.com/docsdf/AFQj2d5F35cl_PRaGR2cM8DhkN_RwFnor_zCK-Oyb_sptRp9MoVTCThNpz9N__iCWu2NHZivm_xwitef4mbJKWQ6QL8OZ4JD0QS3k4bskTvGT5ZVxbUSsXEraIz-eyt7VeoVaY4FlkpqT6f1Ib-UPgIdctxJ6Ayzsut7XBAhVFiADBk-Qo5C=s1600", 1478627, '3535e500dadfcb9013928baca404150c4ebb9873662672a0597933d3cd2c3ab3')
          }
          verified={}
          for lang,(url,expected_size,expected_sha) in originals.items():
              valid=False
              for n in range(1,2):
                  request=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Cache-Control":"no-cache"})
                  with urllib.request.urlopen(request,timeout=75) as response:
                      data=response.read()
                  sha=hashlib.sha256(data).hexdigest()
                  dims=struct.unpack(">II",data[16:24]) if data[:8]==bytes([137,80,78,71,13,10,26,10]) else None
                  exact=(len(data)==expected_size and sha==expected_sha and dims==(1146,1600))
                  pixel_sha=hashlib.sha256(Image.open(io.BytesIO(data)).convert('RGBA').tobytes()).hexdigest() if dims==(1146,1600) else 'invalid'
                  pixel_valid=(pixel_sha=='dda0b75dc44ef4a4fe9adeadd65358c44724efc99a9dcc6ac0706e703333a0ed') if lang=='de' else False
                  if lang=='de' and not pixel_valid:
                      raw=base64.b64decode('')
                      image=Image.open(io.BytesIO(data)).convert('RGBA')
                      bad=[];idx=0
                      for yy in range(0,image.height,128):
                          for xx in range(0,image.width,128):
                              want=struct.unpack('>I',raw[idx*4:idx*4+4])[0]
                              got=zlib.crc32(image.crop((xx,yy,min(xx+128,image.width),min(yy+128,image.height))).tobytes())
                              if want!=got:bad.append((xx,yy))
                              idx+=1
                      print('DE_MISMATCH_TILES',len(bad),bad,flush=True)
                  valid=exact or (lang=='de' and pixel_valid)
                  print(lang,'try',n,'bytes',len(data),'dimensions',dims,'sha',sha,'pixel_sha',pixel_sha,'byte_exact',exact,'accepted',valid,flush=True)
                  if valid:
                      verified[lang]=data
                      break
                  if n<12:time.sleep(2)
              if not valid:
                  raise RuntimeError(f"{lang} did not match the uploaded PNG. No files written.")
          for lang,data in verified.items():
              target=pathlib.Path(f"public/images/cyma-time-o-vox/owners-note-{lang}-20261011.png")
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(data)
              print("STAGED",lang,len(data),hashlib.sha256(data).hexdigest(),flush=True)
          PY
          python /tmp/cyma-verify.py
      - name: Commit three byte-identical PNGs to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/cyma-time-o-vox/owners-note-*.png
          git diff --staged --quiet && { echo "No assets added"; exit 1; }
          git commit -m "assets: add verified CYMA OWNER NOTE JA EN DE originals"
          git push origin HEAD:fix/cyma-owner-note-ja-en-de-20261011
