name: One-time Citizen exact-image transfer via authenticated Slides
on:
  push:
    branches: [fix/citizen-note-images-20261010]
permissions:
  contents: write
jobs:
  import:
    if: "${{ github.event.head_commit.message == 'chore: import Citizen images from Slides' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/citizen-note-images-20261010
      - name: Install Google API client
        run: python -m pip install --quiet requests google-auth
      - name: Download three PNGs and verify exact uploaded hashes before any write
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          cat > /tmp/citizen_source_import.py <<'PY'
          import json, os, hashlib, struct
          from pathlib import Path
          import requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request
          
          raw = os.getenv("GOOGLE_SERVICE_ACCOUNT_JSON")
          if not raw:
              raise RuntimeError("Missing GOOGLE_SERVICE_ACCOUNT_JSON Actions secret; no upload attempted")
          creds = service_account.Credentials.from_service_account_info(
              json.loads(raw),
              scopes=["https://www.googleapis.com/auth/presentations.readonly"],
          )
          creds.refresh(Request())
          sources = {
              "ja": ("citizen_slide", "bf3dcacb73c1daeec3bbe03dc54e11d839463d7d72bb1a1576f9f476b325a444", 993728),
              "en": ("citizen_en_slide", "95f28ea000801f97aa36a36a15d2ac8850aaa2afe99e49603d1abf7aa3eee22a", 990879),
              "de": ("citizen_de_slide", "a6bd0511ff37df71109881c52c5c3333f2654a1d038d7707d0987a95f87c2853", 1021593),
          }
          staged = {}
          for lang, (object_id, want_sha, want_size) in sources.items():
              api_url = "https://slides.googleapis.com/v1/presentations/1Lcz0CEZncDw1GncI4RMY6qDmfO4Fknq4NvpGtBZAaLk/pages/" + object_id + "/thumbnail"
              response = requests.get(api_url, params={"thumbnailProperties.mimeType":"PNG","thumbnailProperties.thumbnailSize":"LARGE"}, headers={"Authorization": "Bearer " + creds.token}, timeout=40)
              response.raise_for_status()
              info = response.json()
              response = requests.get(info["contentUrl"], timeout=90)
              response.raise_for_status()
              data = response.content
              sha = hashlib.sha256(data).hexdigest()
              sig = bytes([137,80,78,71,13,10,26,10])
              wh = struct.unpack(">II",data[16:24]) if data.startswith(sig) and len(data)>=24 else None
              print(f"{lang}: width_height={wh} bytes={len(data)} sha256={sha}")
              if wh != (1146,1600) or len(data) != want_size or sha != want_sha:
                  raise RuntimeError(f"Source slide image for {lang} does not match user provided PNG, refusing entire transfer")
              staged[lang]=data
          for lang,data in staged.items():
              target=Path(f"public/images/citizen-alarm/owners-note-{lang}-20261010.png")
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(data)
          print("All 3 original Citizen PNG files verified and staged unaltered")
          PY
          python /tmp/citizen_source_import.py
      - name: Commit original 3 images only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/citizen-alarm/owners-note-*.png
          git diff --staged --quiet && { echo "No new assets"; exit 1; }
          git commit -m "assets: exact Citizen originals imported"
          git push origin HEAD:fix/citizen-note-images-20261010
