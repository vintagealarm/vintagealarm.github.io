name = "vintage-alarm-analytics"
main = "entry-worker.js"
compatibility_date = "2026-09-08"
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = true

[vars]
REQUEST_HOST = "vintagealarm.github.io"
LEGACY_REQUEST_HOST = "orima1995-create.github.io"

# Secrets are intentionally not committed.
# Set them after deployment:
#   npx wrangler secret put CF_API_TOKEN
#   npx wrangler secret put CF_ACCOUNT_ID
#   npx wrangler secret put DASHBOARD_PASSWORD


[[durable_objects.bindings]]
name = "ARRIVAL_PROBE_STORE"
class_name = "ArrivalProbeStore"

[[migrations]]
tag = "arrival_probe_do_v1"
new_sqlite_classes = ["ArrivalProbeStore"]

# Archive completed UTC days before the seven-day unsampled window closes.
# Cron triggers are part of the existing Worker; no new paid provider is added.
[triggers]
crons = ["20 2 * * *"]
