<title id="ttl">触読式機械式アラーム比較線図 — ARSA、Enicar、BEAT</title>
<desc id="desc">ARSA掲載個体の触覚目盛、1964年Enicar特別個体の針幅と先端4隆起、BEATの6時側にある独立開閉装置を比較した線図。未記録の針加工は再現しない。</desc>
